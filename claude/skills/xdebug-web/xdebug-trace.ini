; xdebug-web skill: on-trigger function tracing for FPM requests.
; Parsed after 15-xdebug.ini: adds "trace" to the existing mode and moves output to a
; host-visible dir (FPM units run with PrivateTmp, so /tmp is invisible from the shell).
[xdebug]
xdebug.mode = debug,develop,trace
xdebug.start_with_request = trigger
xdebug.output_dir = /var/lib/xdebug
xdebug.trace_output_name = trace.%t
xdebug.trace_format = 1
xdebug.collect_params = 4
xdebug.collect_return = 1
xdebug.use_compression = 0
